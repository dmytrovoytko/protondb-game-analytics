name: ingest.games
type: duckdb.seed
strategy: replace
parameters:
  path: games.csv-filtered.csv
connection: duckdb-default
description: |
  Loads the Steam games data table from local CSV file.
  This table contains Steam games information including release date, estimated owners number, price, genres.

  Design Choices:
  - Why read from local CSV:
    - smaller subset of original [Steam Games Dataset](https://www.kaggle.com/datasets/fronkongames/steam-games-dataset)
    - original games.csv is 389.15 MB, includes columns we don't need, it was not updating
    - Local seed file provides version control and reproducibility

  - Why seed file:
    - Seed files are a convenient way to load static data into a database
    - Seed asset automatically materializes into a table on each run

secrets:
  - key: duckdb-default
    inject_as: duckdb-default
columns: 
  - name: app_id
    type: BIGINT
    checks:
      - name: not_null
      # - name: unique
  - name: name
    type: VARCHAR
    checks:
      - name: not_null
  - name: release_date
    type: VARCHAR
  - name: estimated_owners
    type: VARCHAR
  - name: price
    type: FLOAT
  - name: windows
    type: BOOL
  - name: linux
    type: BOOL
  - name: metacritic_score
    type: VARCHAR
  - name: positive
    type: VARCHAR
  - name: negative
    type: VARCHAR
  - name: genres
    type: VARCHAR
